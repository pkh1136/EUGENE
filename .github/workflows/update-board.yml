name: Update research board

# 유진투자증권 리서치센터 게시판의 최신 목록을 board.json에 저장합니다.
# index.html(GitHub Pages)이 이 파일을 읽어 '리포트 보관함'을 채웁니다.

on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 (GitHub 사정에 따라 몇 분 늦을 수 있습니다)
  workflow_dispatch:          # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-board
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch board
        run: node scripts/update-board.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain board.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add board.json
            git commit -m "Update research board"
            git push
          fi
